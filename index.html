const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function ouvrir(k){const raw=b64(P);const key=await crypto.subtle.importKey('raw',b64(k.trim()),'AES-GCM',false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
 try{localStorage.setItem('mk',k.trim())}catch(e){}
 document.open();document.write(new TextDecoder().decode(pt));document.close()}
function demander(msg){document.getElementById('m').textContent=msg||'Entre ton code secret.';document.getElementById('f').style.display=''}
(async()=>{let k=location.hash.slice(1);if(!k){try{k=localStorage.getItem('mk')||''}catch(e){}}
 if(!k)return demander();
 try{await ouvrir(k)}catch(e){demander('Code incorrect. Réessaie.')}})();
document.getElementById('f').onsubmit=async e=>{e.preventDefault();try{await ouvrir(document.getElementById('k').value)}catch(x){document.getElementById('e').textContent='Code incorrect.'}};
